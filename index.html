<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Team Metrix</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Layout: top bar with tabs + global month, then one working view per tab; dashboard = summary tiles → leaderboard → person detail */
:root{
  --bg:#f3f5f2; --surface:#ffffff; --ink:#18221c; --muted:#5d6b62; --line:#dde3dd; --accent:#2f6b4f; --accent-soft:#e3efe8;
  --epi:#1f8a4c; --epi-bg:#dcf2e4; --mpi:#a36a00; --mpi-bg:#fbefd3; --lpi:#b8520f; --lpi-bg:#fde4d2; --low:#b42318; --low-bg:#fbe0dd;
  --display:"Plus Jakarta Sans",system-ui,sans-serif; --body:"IBM Plex Sans",system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#111613; --surface:#1a211d; --ink:#e7ede8; --muted:#9aa89f; --line:#2c3630; --accent:#6fc496; --accent-soft:#213229;
  --epi:#5fd08f; --epi-bg:#183424; --mpi:#f0bd4f; --mpi-bg:#3a2e12; --lpi:#f39a5b; --lpi-bg:#3b2414; --low:#f2867b; --low-bg:#3d1c19; color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#111613; --surface:#1a211d; --ink:#e7ede8; --muted:#9aa89f; --line:#2c3630; --accent:#6fc496; --accent-soft:#213229;
  --epi:#5fd08f; --epi-bg:#183424; --mpi:#f0bd4f; --mpi-bg:#3a2e12; --lpi:#f39a5b; --lpi-bg:#3b2414; --low:#f2867b; --low-bg:#3d1c19; color-scheme:dark;}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--body)}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance}
h2{font-size:18px}
h3{font-size:15px}
.num{font-variant-numeric:tabular-nums}
header{background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.bar{max-width:1200px;margin:0 auto;padding:12px 20px;display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center}
.brand{font-family:var(--display);font-weight:800;font-size:18px;color:var(--accent)}
nav{display:flex;gap:4px;flex-wrap:wrap}
nav a{padding:7px 12px;border-radius:8px;color:var(--muted);text-decoration:none;font-weight:600;font-size:14px}
nav a[aria-current="page"]{background:var(--accent-soft);color:var(--accent)}
nav a:hover{color:var(--ink)}
.spacer{flex:1}
.monthpick{display:flex;align-items:center;gap:8px;font-weight:600;font-size:14px}
main{max-width:1200px;margin:0 auto;padding:20px;display:grid;gap:18px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.between{justify-content:space-between}
.muted{color:var(--muted)}
.small{font-size:13px}
input,select,button{font:inherit;color:inherit}
input[type=text],input[type=number],input[type=month],select{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:7px 10px;min-width:0}
input:focus-visible,select:focus-visible,button:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button{cursor:pointer;border-radius:8px;border:1px solid var(--line);background:var(--surface);padding:7px 14px;font-weight:600}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--surface)}
button.ghost{border-color:transparent;background:transparent;color:var(--muted)}
button.danger{color:var(--low)}
button:disabled{opacity:.5;cursor:default}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;border-top:4px solid var(--line)}
.tile .v{font-family:var(--display);font-size:30px;font-weight:800;line-height:1.1}
.tile .l{font-size:13px;color:var(--muted);font-weight:600}
.tile.t-epi{border-top-color:var(--epi)} .tile.t-mpi{border-top-color:var(--mpi)} .tile.t-lpi{border-top-color:var(--lpi)} .tile.t-low{border-top-color:var(--low)} .tile.t-acc{border-top-color:var(--accent)}
.tablewrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);font-weight:600;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:none}
td.r,th.r{text-align:right}
.pill{display:inline-block;padding:2px 10px;border-radius:999px;font-size:12px;font-weight:700;white-space:nowrap}
.s-EPI{background:var(--epi-bg);color:var(--epi)} .s-MPI{background:var(--mpi-bg);color:var(--mpi)} .s-LPI{background:var(--lpi-bg);color:var(--lpi)} .s-Below{background:var(--low-bg);color:var(--low)} .s-none{background:var(--bg);color:var(--muted)}
.ck{font-size:11px;font-weight:700;padding:1px 7px;border-radius:5px;border:1px solid var(--line);color:var(--muted)}
.ck.Critical{border-color:var(--low);color:var(--low)}
.meter{height:8px;border-radius:99px;background:var(--bg);overflow:hidden;min-width:80px;position:relative}
.meter span{display:block;height:100%;border-radius:99px}
.linkbtn{background:none;border:none;padding:0;color:var(--ink);font-weight:600;text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:3px}
.grid2{display:grid;grid-template-columns:1.2fr 1fr;gap:18px}
.entrygrid{display:grid;grid-template-columns:240px 1fr;gap:18px;align-items:start}
.plist{display:grid;gap:6px}
.plist button{display:flex;justify-content:space-between;align-items:center;text-align:left;font-weight:500;gap:8px}
.plist button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent);font-weight:700}
.cat{margin-top:14px;font-family:var(--display);font-weight:700;font-size:13px;color:var(--accent);text-transform:uppercase;letter-spacing:.05em}
.jobs{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.jobs label{display:flex;gap:6px;align-items:center;border:1px solid var(--line);border-radius:8px;padding:5px 10px;font-size:13px;cursor:pointer}
.jobs label:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
.members{display:grid;gap:14px}
.empty{padding:28px;text-align:center;color:var(--muted)}
.notice{background:var(--mpi-bg);color:var(--ink);border-radius:10px;padding:10px 14px;font-size:14px}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:10px 18px;border-radius:10px;font-weight:600;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:20}
.toast.on{opacity:1}
.conn{font-size:12px;font-weight:700;padding:3px 10px;border-radius:999px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.conn.ok{background:var(--epi-bg);color:var(--epi);border-color:transparent}
.conn.sync{background:var(--mpi-bg);color:var(--mpi);border-color:transparent}
.conn.err{background:var(--low-bg);color:var(--low);border-color:transparent}
.seg{display:flex;gap:2px;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:2px}
.seg button{border:none;background:transparent;color:var(--muted);padding:6px 12px;border-radius:8px;font-size:13px;font-weight:700}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--accent)}
.share{height:8px;border-radius:99px;background:var(--bg);overflow:hidden;min-width:70px}
.share span{display:block;height:100%;border-radius:99px;background:var(--accent)}
.delrow{display:grid;grid-template-columns:1fr 110px auto;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.delrow:last-of-type{border-bottom:none}
.tag{display:inline-block;background:var(--accent-soft);color:var(--accent);font-size:12px;font-weight:700;padding:2px 9px;border-radius:999px}
.agrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:8px;margin-top:8px}
.agrid label{display:flex;align-items:center;justify-content:space-between;gap:8px;border:1px solid var(--line);border-radius:8px;padding:5px 10px;font-size:13px;cursor:pointer}
.agrid label.on{border-color:var(--accent);background:var(--accent-soft)}
.agrid input[type=number]{width:64px;text-align:right;padding:4px 6px}
.lineinfo{font-size:12px;font-weight:700;white-space:nowrap}
.lineinfo.ok{color:var(--epi)} .lineinfo.under{color:var(--mpi)} .lineinfo.over{color:var(--low)} .lineinfo.none{color:var(--muted)}
.line{border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-top:12px}
.podgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(272px,1fr));gap:14px;align-items:start}
.pod{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.pod>.head{padding:9px 13px;color:#fff;display:flex;justify-content:space-between;align-items:center;gap:8px;font-family:var(--display);font-weight:700}
.pod>.head .t{font-size:11px;font-weight:600;opacity:.85;text-transform:uppercase;letter-spacing:.05em}
.pod>.head button{background:rgba(255,255,255,.18);border:none;color:#fff;padding:2px 8px;font-size:12px}
.pod>.body{padding:10px 13px 13px}
.pod.drop{outline:2px dashed var(--accent);outline-offset:-3px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:5px 0 0}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-size:13px;background:var(--bg);cursor:grab}
.chip.sel{border-color:var(--accent);background:var(--accent-soft);color:var(--accent);font-weight:700}
.chip .own{font-size:11px;color:var(--muted)}
.chip.sel .own{color:var(--accent)}
.mcard{display:flex;justify-content:space-between;align-items:center;gap:8px;border:1px solid var(--line);border-radius:8px;padding:5px 9px;margin-top:6px;font-size:13px;cursor:grab;background:var(--bg)}
.mcard.sel{border-color:var(--accent);background:var(--accent-soft)}
.rtag{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.03em;border-radius:4px;padding:1px 5px;background:var(--surface);border:1px solid var(--line);color:var(--muted)}
.rtag.sr{border-color:var(--accent);color:var(--accent)}
.sublab{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:700;margin-top:11px}
.issue{font-size:13px;padding:3px 0}
.issue .err{color:var(--low);font-weight:700}
.issue .warn{color:var(--mpi);font-weight:700}
.dragging{opacity:.4}
.flds{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-top:12px}
.flds label{display:grid;gap:4px;font-size:13px;color:var(--muted);font-weight:600}
code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;background:var(--bg);padding:1px 5px;border-radius:5px}
canvas{max-width:100%}
.chartbox{position:relative;height:260px}
input.cell{width:90px;text-align:right}
@media (max-width:860px){.grid2,.entrygrid{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header>
  <div class="bar">
    <div class="brand">Team Metrix</div>
    <div class="seg" id="seg" role="group" aria-label="Section">
      <button data-sec="metrics">Team Metrics</button>
      <button data-sec="deliv">Deliverables</button>
      <button data-sec="alloc">Allocation</button>
      <button data-sec="struct">Structure</button>
    </div>
    <nav id="nav"></nav>
    <div class="spacer"></div>
    <span class="conn" id="connBadge">Local only</span>
    <label class="monthpick" for="month">Month <input type="month" id="month"></label>
  </div>
</header>
<main id="view"></main>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="model.js"></script>
<script>
(function(){
"use strict";
// ---------- Defaults (from the team's metric sheet) ----------
const S="Social (Organic)", A="Ads (Paid)", V="Service";
const BASE={
  Junior:[[S,"Reels","Critical"],[S,"Post","Key"],[S,"Ai video job","Key"],[S,"Carousel","Key"],[S,"Thumbnail","Key"],[S,"Shoot","Key"],[S,"Video edit","Key"],
          [A,"Ads","Critical"],[A,"Ai video job","Key"],[A,"Hook rate","Critical"],[A,"Hold rate","Critical"],[A,"Post ads","Key"],[A,"Carousel ads","Key"],[A,"Shoot","Key"],
          [V,"Company videos","Key"],[V,"FFC","Key"],[V,"Shoot","Key"]],
  Senior:[[S,"Reels","Critical"],[S,"Post","Key"],[S,"Script prep","Key"],[S,"Carousel","Key"],[S,"Thumbnail","Key"],[S,"Longform video","Key"],[S,"Shoot","Critical"],[S,"Video edit","Key"],
          [A,"Ads","Critical"],[A,"Post ads","Key"],[A,"Carousel ads","Key"],[A,"Hook rate","Critical"],[A,"Hold rate","Critical"],[A,"Shoot","Critical"],
          [V,"Company videos","Key"],[V,"FFC","Key"],[V,"Shoot","Key"]]
};
function defaultConfig(){
  const lib=[]; let n=1;
  for(const lvl of ["Junior","Senior"]) for(const [c,j,k] of BASE[lvl]) lib.push({id:"j"+(n++),level:lvl,category:c,job:j,ck:k});
  return {
    lib,
    team:[{id:"p1",name:"Varadharaj",level:"Senior",jobs:lib.filter(x=>x.level==="Senior"&&(["Script prep","Video edit"].includes(x.job)||(x.job==="Ads"&&x.category===A))).map(x=>x.id)}],
    settings:{epi:100,mpi:85,lpi:70,wc:2,wk:1,cap:120},
    brands:[],                                   // deliverables side: [{id,name,items:[{id,name}]}]
    atags:{}                                     // allocation side: "brandId|itemId" -> {ck:"Key"|"Critical", kind:"count"|"resp"}
  };
}

// ---------- State ----------
let config=defaultConfig(), configSaved=false;
const months={};           // metrics:      "2026-11" -> {e:{pid:{jid:{g,a}}}}
const bmonths={};          // deliverables: "2026-11" -> {q:{brandId:{itemId:qty}}}
const amonths={};          // allocation:   "2026-11" -> {a:{"brandId|itemId|personId":value}}
const smonths={};          // structure:    "2026-11" -> {pods,bpod,mpod,roles,own,meta}  (see model.js)
const sheet={url:"",state:"off",msg:""};   // Google Sheet backend (Apps Script web app)
const ui={view:"dashboard",month:currentMonth(),entryPerson:null,dashPerson:null,drafts:{},confirmDel:null,
          brandSel:null,brandDash:null,bdrafts:{},
          allocWho:null,allocPerson:null,adrafts:{},
          podEdit:null};
const charts={};
// Three independent sections. Allocation reads the team and the plan but writes only its own data;
// the metrics and deliverables features behave exactly as they did before it existed.
const VIEWS={
  dashboard:{sec:"metrics",label:"Dashboard"},
  entry:    {sec:"metrics",label:"Monthly Entry"},
  team:     {sec:"metrics",label:"Team &amp; Roles"},
  jobs:     {sec:"metrics",label:"Jobs &amp; Settings"},
  plan:     {sec:"deliv",  label:"Plan"},
  brands:   {sec:"deliv",  label:"Overview"},
  split:    {sec:"alloc",  label:"Split"},
  load:     {sec:"alloc",  label:"Team load"},
  pods:     {sec:"struct", label:"Builder"},
  workload: {sec:"struct", label:"Workload"}
};
const secOf=v=>(VIEWS[v]||VIEWS.dashboard).sec;

function currentMonth(){const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0");}
function monthLabel(m){const [y,mm]=m.split("-");return new Date(+y,+mm-1,1).toLocaleString("en-IN",{month:"short",year:"numeric"});}
function shiftMonth(m,k){const [y,mm]=m.split("-").map(Number);const d=new Date(y,mm-1+k,1);return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0");}
function uid(p){return p+Math.random().toString(36).slice(2,9);}
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const libById=id=>config.lib.find(x=>x.id===id);
const pct=v=>v==null?"–":Math.round(v*100)+"%";

// ---------- Scoring ----------
function statusOf(r){const s=config.settings; if(r==null)return null; const p=r*100; return p>=s.epi?"EPI":p>=s.mpi?"MPI":p>=s.lpi?"LPI":"Below";}
function personRows(pid,m){
  const e=months[m]?.e?.[pid]||{}; const out=[];
  for(const jid of Object.keys(e)){
    const L=libById(jid); if(!L)continue; const {g,a}=e[jid];
    if(g===""||g==null||a===""||a==null||+g<=0)continue;
    const ach=Math.min(+a/+g,config.settings.cap/100);
    out.push({jid,cat:L.category,job:L.job,ck:L.ck,g:+g,a:+a,ach,st:statusOf(ach),w:L.ck==="Critical"?+config.settings.wc:+config.settings.wk});
  }
  const order=[S,A,V]; out.sort((x,y)=>(order.indexOf(x.cat)+1||9)-(order.indexOf(y.cat)+1||9)||x.job.localeCompare(y.job));
  return out;
}
function personScore(p,m){
  const rows=personRows(p.id,m);
  if(!rows.length)return {rows,overall:null,status:null,critFail:0,crit:0};
  const ws=rows.reduce((t,r)=>t+r.w,0); const overall=ws?rows.reduce((t,r)=>t+r.ach*r.w,0)/ws:null;
  const critFail=rows.filter(r=>r.ck==="Critical"&&r.ach*100<config.settings.lpi).length;
  let status=statusOf(overall); if(status==="EPI"&&critFail>0)status="MPI";
  return {rows,overall,status,critFail,crit:rows.filter(r=>r.ck==="Critical").length};
}
function teamBoard(m){
  const list=config.team.map(p=>({p,...personScore(p,m)}));
  list.sort((a,b)=>(b.overall??-1)-(a.overall??-1));
  let rank=0; list.forEach(x=>{x.rank=x.overall==null?null:++rank;});
  return list;
}

// ---------- Storage: the Google Sheet is the database ----------
// The page talks to an Apps Script web app bound to the sheet (see Code.gs).
// Everything is mirrored into this browser too, so the page still works offline.
function toast(msg){const t=document.getElementById("toast");t.textContent=msg;t.classList.add("on");clearTimeout(toast._t);toast._t=setTimeout(()=>t.classList.remove("on"),2600);}
const queues={};
function queued(key,fn){queues[key]=(queues[key]||Promise.resolve()).then(fn,fn);return queues[key];}
function plain(o){return JSON.parse(JSON.stringify(o));}

const LS_DATA="tm-data", LS_URL="tm-sheet-url";
function lsGet(k){try{return localStorage.getItem(k);}catch(e){return null;}}
function lsSet(k,v){try{localStorage.setItem(k,v);}catch(e){}}
function cacheSave(){lsSet(LS_DATA,JSON.stringify({config,months,bmonths,amonths,smonths}));}
function cacheLoad(){
  sheet.url=lsGet(LS_URL)||"";
  try{const d=JSON.parse(lsGet(LS_DATA)||"null");
    if(d&&d.config){config=normalizeConfig(d.config);configSaved=true;}
    if(d&&d.months)Object.assign(months,d.months);
    if(d&&d.bmonths)Object.assign(bmonths,d.bmonths);
    if(d&&d.amonths)Object.assign(amonths,d.amonths);
    if(d&&d.smonths)Object.assign(smonths,d.smonths);
  }catch(e){}
}
function normalizeConfig(c){
  const d=defaultConfig();
  return {lib:(c&&c.lib&&c.lib.length)?c.lib:d.lib,
          team:(c&&Array.isArray(c.team))?c.team.map(p=>({id:p.id,name:p.name,level:p.level==="Senior"?"Senior":"Junior",jobs:p.jobs||[],
                 display:p.display||"",skills:p.skills||[],capacity:p.capacity==null?"":+p.capacity||"",active:p.active!==false})):[],
          settings:Object.assign({},d.settings,(c&&c.settings)||{}),
          brands:(c&&Array.isArray(c.brands))?c.brands.map(b=>({id:b.id,name:b.name,items:(b.items||[]).map(i=>({id:i.id,name:i.name})),
                   kind:b.kind||"organic",platforms:b.platforms||[],formats:b.formats||[],notes:b.notes||"",active:b.active!==false})):[],
          atags:(c&&c.atags&&typeof c.atags==="object")?c.atags:{}};
}
function setConn(state,msg){sheet.state=state;sheet.msg=msg||"";updateBadge();}
function updateBadge(){
  const b=document.getElementById("connBadge"); if(!b)return;
  const t={off:["","Local only"],sync:["sync","Syncing…"],ok:["ok","Sheet connected"],err:["err","Sheet error"]}[sheet.state]||["","Local only"];
  b.className="conn "+t[0]; b.textContent=t[1]; b.title=sheet.msg||t[1];
}
function connNote(){
  if(sheet.state==="err")return `<div class="notice">Google Sheet: ${esc(sheet.msg)} Your changes are being kept in this browser meanwhile — <a href="#jobs">check the connection</a>.</div>`;
  if(!sheet.url)return `<div class="notice">No Google Sheet connected, so data stays in this browser only. <a href="#jobs">Connect your sheet</a> in Jobs &amp; Settings.</div>`;
  return "";
}

async function sheetCall(action,body){
  if(!sheet.url)throw new Error("No Google Sheet is connected.");
  let res;
  try{res=await fetch(sheet.url,{method:"POST",redirect:"follow",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(Object.assign({action},body||{}))});}
  catch(e){throw new Error("Couldn't reach the sheet. Check the internet connection and the web app URL.");}
  if(!res.ok)throw new Error("The sheet replied with error "+res.status+". Re-deploy the Apps Script with access set to Anyone.");
  const txt=await res.text(); let j;
  try{j=JSON.parse(txt);}catch(e){throw new Error("That URL didn't return data. Use the web app /exec URL, deployed with access set to Anyone.");}
  if(!j.ok)throw new Error(j.error||"The sheet reported an error.");
  return j;
}
async function pullSheet(){
  if(!sheet.url){setConn("off");render();return false;}
  setConn("sync");render();
  try{
    const j=await sheetCall("load");
    const c=j.config||{};
    if(c.lib&&c.lib.length){config=normalizeConfig(c);configSaved=true;}
    else{await sheetCall("saveConfig",{config:plain(config)});}   // empty sheet: seed it with what we have
    for(const k of Object.keys(months))delete months[k];
    Object.assign(months,j.months||{});
    for(const k of Object.keys(bmonths))delete bmonths[k];
    Object.assign(bmonths,j.bmonths||{});
    for(const k of Object.keys(amonths))delete amonths[k];
    Object.assign(amonths,j.amonths||{});
    for(const k of Object.keys(smonths))delete smonths[k];
    Object.assign(smonths,j.smonths||{});
    ui.drafts={}; ui.bdrafts={}; ui.adrafts={};
    setConn("ok");cacheSave();render();return true;
  }catch(err){setConn("err",err.message);render();return false;}
}

const brandById=id=>config.brands.find(b=>b.id===id);

function planQty(m,bid,iid){const v=bmonths[m]&&bmonths[m].q&&bmonths[m].q[bid]?bmonths[m].q[bid][iid]:undefined;return(v===""||v==null)?null:+v;}
function brandRows(b,m){return (b.items||[]).map(i=>({i,qty:planQty(m,b.id,i.id)}));}
function brandTotal(b,m){return brandRows(b,m).reduce((t,r)=>t+(r.qty||0),0);}
function planBoard(m){
  return config.brands.map(b=>({b,rows:brandRows(b,m),total:brandTotal(b,m)})).sort((x,y)=>y.total-x.total);
}
function typeTotals(m){
  const map={};
  config.brands.forEach(b=>brandRows(b,m).forEach(r=>{
    if(!r.qty)return;
    const name=String(r.i.name).trim(), key=name.toLowerCase();
    if(!map[key])map[key]={name,qty:0,brands:new Set()};
    map[key].qty+=r.qty; map[key].brands.add(b.id);
  }));
  return Object.values(map).map(x=>({name:x.name,qty:x.qty,brands:x.brands.size})).sort((a,b)=>b.qty-a.qty);
}

// ---------- Allocation: model ----------
// Reads config.team (metrics side) and the plan quantities (deliverables side); writes only
// config.atags and amonths. Neither of the other two features reads anything from here.
const akey=(b,i,p)=>b+"|"+i+"|"+p;
const tkey=(b,i)=>b+"|"+i;
function tagOf(bid,iid){const t=config.atags[tkey(bid,iid)]||{};return{ck:t.ck==="Critical"?"Critical":"Key",kind:t.kind==="resp"?"resp":"count"};}
function allocVal(m,bid,iid,pid){const a=amonths[m]&&amonths[m].a;const v=a?a[akey(bid,iid,pid)]:undefined;return(v===""||v==null)?null:+v;}
function lineSplit(m,bid,iid){return config.team.reduce((t,p)=>t+(allocVal(m,bid,iid,p.id)||0),0);}
function plannedCountTotal(m){
  let t=0; config.brands.forEach(b=>(b.items||[]).forEach(i=>{
    if(tagOf(b.id,i.id).kind!=="count")return; const q=planQty(m,b.id,i.id); if(q)t+=q;}));
  return t;
}
function personLines(m,pid){
  const out=[];
  config.brands.forEach(b=>(b.items||[]).forEach(i=>{
    const v=allocVal(m,b.id,i.id,pid); if(!v)return;
    const t=tagOf(b.id,i.id);
    out.push({bid:b.id,iid:i.id,brand:b.name,item:i.name,qty:t.kind==="resp"?null:v,ck:t.ck,kind:t.kind});
  }));
  return out;
}
function personLoad(m,p){
  const lines=personLines(m,p.id);
  return {p,lines,
    qty:lines.filter(l=>l.kind==="count").reduce((t,l)=>t+(l.qty||0),0),
    resp:lines.filter(l=>l.kind==="resp").length,
    crit:lines.filter(l=>l.ck==="Critical").length,
    brands:new Set(lines.map(l=>l.bid)).size};
}
function loadBoard(m){return config.team.map(p=>personLoad(m,p)).sort((a,b)=>b.qty-a.qty||b.resp-a.resp);}
function allocGaps(m){
  const out=[];
  config.brands.forEach(b=>(b.items||[]).forEach(i=>{
    if(tagOf(b.id,i.id).kind!=="count")return;
    const planned=planQty(m,b.id,i.id); if(planned==null)return;
    const split=lineSplit(m,b.id,i.id);
    if(split!==planned)out.push({brand:b.name,item:i.name,planned,split,left:planned-split});
  }));
  return out.sort((a,b)=>Math.abs(b.left)-Math.abs(a.left));
}

// The "planned N · split M · K left" line. The split total mixes everyone else's saved
// numbers with the open draft of the person currently on screen, so it stays honest while typing.
function lineSplitWith(m,bid,iid,pid,d){
  return config.team.reduce((t,x)=>t+(x.id===pid?(+d[bid+"|"+iid]||0):(allocVal(m,bid,iid,x.id)||0)),0);
}
function lineAssignedWith(m,bid,iid,pid,d){
  return config.team.filter(x=>x.id===pid?!!d[bid+"|"+iid]:!!allocVal(m,bid,iid,x.id)).length;
}
function lineLeft(m,bid,iid,pid,d){
  const planned=planQty(m,bid,iid);
  return planned==null?0:planned-lineSplitWith(m,bid,iid,pid,d);
}
function lineInfoText(m,bid,item,pid,d){
  if(tagOf(bid,item.id).kind==="resp")return lineAssignedWith(m,bid,item.id,pid,d)+" assigned";
  const split=lineSplitWith(m,bid,item.id,pid,d), planned=planQty(m,bid,item.id);
  if(planned==null)return "not in the plan · split "+split;
  const left=planned-split;
  return "planned "+planned+" · split "+split+" · "+(left===0?"all done":left>0?left+" left":Math.abs(left)+" over");
}
function lineInfoCls(m,bid,item,pid,d){
  if(tagOf(bid,item.id).kind==="resp")return "none";
  const planned=planQty(m,bid,item.id); if(planned==null)return "none";
  const left=planned-lineSplitWith(m,bid,item.id,pid,d);
  return left===0?"ok":left>0?"under":"over";
}
function draftTotals(d){
  let pieces=0,resp=0,crit=0;
  Object.keys(d).forEach(k=>{
    if(!d[k])return;
    const parts=k.split("|"), t=tagOf(parts[0],parts[1]);
    if(t.kind==="resp")resp++; else pieces+=(+d[k]||0);
    if(t.ck==="Critical")crit++;
  });
  return {pieces,resp,crit};
}
// Every deliverable the brand has is shown, planned or not — otherwise a line with no
// quantity could never be reached to mark it as a responsibility.
function visibleItems(m,b,pid,d){return b.items||[];}
function brandSubtotal(m,b,pid,d){
  return visibleItems(m,b,pid,d).reduce((t,i)=>t+(tagOf(b.id,i.id).kind==="count"?(+d[b.id+"|"+i.id]||0):0),0);
}

        <div class="row"><button id="copyPrevAlloc">Copy from ${esc(monthLabel(shiftMonth(m,-1)))}</button><button class="primary" id="saveAlloc" ${dirty?"":"disabled"}>${dirty?"Save":"Saved"}</button></div>
      </div>
      ${blocks.length?blocks.map(({b,items})=>`
        <div class="row between" style="margin-top:16px;align-items:baseline">
          <div class="cat" style="margin:0">${esc(b.name)}</div>

        </div>
        ${items.map(i=>{const t=tagOf(b.id,i.id), k=b.id+"|"+i.id, v=d[k], left=lineLeft(m,b.id,i.id,p.id,d);
          return `<div class="line">
            <div class="row between">

      <p class="muted small" style="margin:14px 0 0">A <b>Deliverable</b> line is a count — <b>Take N</b> drops whatever is still unassigned into this person's box. A <b>Responsibility</b> line has no number, you just tick whoever owns it. Both carry a Key or Critical weight, and both show how much of that line is already spread across the team.</p>
    </div>

function refreshSplitLive(m,pid,d,k){

function renderLoad(){
  const m=ui.month, board=loadBoard(m), gaps=allocGaps(m);
  if(!config.team.length)return `<div class="card empty"><h2>No team members yet</h2><p>Add them in <a href="#team">Team &amp; Roles</a>.</p></div>`;

  if(!ui.allocPerson||!config.team.some(p=>p.id===ui.allocPerson))ui.allocPerson=(top&&top.p.id)||config.team[0].id;
  const sel=config.team.find(p=>p.id===ui.allocPerson), sl=personLoad(m,sel);
  return `

    <div class="row"><span class="muted small">${board.filter(x=>x.lines.length).length} of ${config.team.length} people have work</span><button class="primary" id="exportAllocCsv">Export CSV</button></div></div>

// Two screens only. The builder lists the pods; pressing Edit opens one pod and
// everything about that pod is decided there — which channels, which people, who
// owns what. Nothing is pre-filled: brands come from Deliverables, people from
// Team & Roles, and you pick from those lists.
const POD_COLORS=["#2f6b4f","#1f6f8b","#a36a00","#7a4fb5","#b8520f","#4a6b2f","#9b2f5f","#5d6b62"];
const memberById=id=>config.team.find(p=>p.id===id);
function structOf(m){
  if(!smonths[m])smonths[m]=TMModel.emptyStructure();
  const s=smonths[m];
  if(!Array.isArray(s.pods))s.pods=[];
  ["bpod","bteam","mpod","roles","own"].forEach(k=>{if(!s[k]||typeof s[k]!=="object")s[k]={};});
  if(!s.meta)s.meta={manager:"",lead:""};
  return s;
}
function piecesFor(m,pid){ const p=memberById(pid); return p?personLoad(m,p).qty:0; }
function structIssues(m){
  return TMModel.validate({struct:structOf(m),brands:config.brands,team:config.team,loadFor:pid=>piecesFor(m,pid)});
}
// After a move, drop anyone who no longer belongs: a channel's crew and owners must sit
// in that channel's pod, or be floaters. Brands left Unassigned keep theirs.
function pruneStructure(s){
  Object.keys(s.bteam).forEach(bid=>{
    const pod=s.bpod[bid]; if(!pod)return;
    const ok=pid=>{const mp=s.mpod[pid];return mp&&(mp===pod||TMModel.isFloaterPod(s,mp));};
    s.bteam[bid]=(s.bteam[bid]||[]).filter(ok);
    if(!s.bteam[bid].length)delete s.bteam[bid];
  });
  Object.keys(s.own).forEach(bid=>{
    const pod=s.bpod[bid]; if(!pod)return;
    const o=s.own[bid], ok=pid=>pid&&(s.mpod[pid]===pod||TMModel.isFloaterPod(s,s.mpod[pid]));
    if(!ok(o.p))o.p="";
    if(!ok(o.b))o.b="";
    if(!o.p&&!o.b)delete s.own[bid];
  });
}

// Drag and drop on the pod list. Re-attached after every render.
function wireDnD(){
  const v=view();
  v.querySelectorAll("[data-drag]").forEach(el=>{
    el.draggable=true;
    el.addEventListener("dragstart",e=>{e.dataTransfer.setData("text/plain",el.dataset.drag);e.dataTransfer.effectAllowed="move";el.classList.add("dragging");});
    el.addEventListener("dragend",()=>el.classList.remove("dragging"));
  });
  v.querySelectorAll("[data-drop]").forEach(z=>{
    z.addEventListener("dragover",e=>{e.preventDefault();e.dataTransfer.dropEffect="move";z.classList.add("drop");});
    z.addEventListener("dragleave",()=>z.classList.remove("drop"));
    z.addEventListener("drop",async e=>{
      e.preventDefault();z.classList.remove("drop");
      const data=e.dataTransfer.getData("text/plain"); if(!data)return;
      const ix=data.indexOf(":");
      await moveToPod(data.slice(0,ix),data.slice(ix+1),z.dataset.drop);
    });
  });
}
async function moveToPod(kind,id,podId){
  const m=ui.month,s=structOf(m);
  if(kind==="brand"){
    if(s.bpod[id]===podId)return;
    if(podId)s.bpod[id]=podId; else delete s.bpod[id];
    const b=brandById(id); toast(`${b?b.name:"Channel"} → ${podId?(TMModel.podById(s,podId)||{}).name:"not in any pod"}`);
  }else{
    if(s.mpod[id]===podId)return;
    if(podId)s.mpod[id]=podId; else delete s.mpod[id];
    const p=memberById(id); toast(`${p?TMModel.displayNameOf(p):"Person"} → ${podId?(TMModel.podById(s,podId)||{}).name:"not in any pod"}`);
  }
  pruneStructure(s);
  render(); await saveStruct(m);
}

// ---------- Structure: workload ----------
// The Deliverables plan reaches the pods on its own. A channel's planned quantity is
// shared between the people on that channel, and the result is ordinary allocation
// data — the same numbers Allocation → Team load counts. Anything already set by hand
// is left alone; only untouched channels are filled in.
function lineAlloc(m,bid,iid){
  const a=(amonths[m]&&amonths[m].a)||{}, out={};
  Object.keys(a).forEach(k=>{const p=k.split("|");if(p[0]===bid&&p[1]===iid)out[p[2]]=+a[k];});
  return out;
}
function setLineAlloc(m,bid,iid,split){
  amonths[m]=amonths[m]||{a:{}}; amonths[m].a=amonths[m].a||{};
  const a=amonths[m].a, pre=bid+"|"+iid+"|";
  Object.keys(a).forEach(k=>{if(k.indexOf(pre)===0)delete a[k];});
  Object.keys(split).forEach(pid=>{if(+split[pid]>0)a[pre+pid]=+split[pid];});
}
function autoFillWorkload(m){
  const s=structOf(m); let filled=0;
  config.brands.forEach(b=>{
    if(!s.bpod[b.id])return;
    const crew=TMModel.peopleOnBrand(s,b.id); if(!crew.length)return;
    (b.items||[]).forEach(i=>{
      if(tagOf(b.id,i.id).kind!=="count")return;
      const q=planQty(m,b.id,i.id); if(!q)return;
      if(Object.keys(lineAlloc(m,b.id,i.id)).length)return;  // already decided
      setLineAlloc(m,b.id,i.id,TMModel.splitEvenly(q,crew));
      filled++;
    });
  });
  return filled;
}
function podWorkload(m){
  const s=structOf(m);
  return TMModel.sortedPods(s).map(pod=>{
    const brands=config.brands.filter(b=>s.bpod[b.id]===pod.id);
    const people=config.team.filter(p=>s.mpod[p.id]===pod.id);
    const channels=brands.map(b=>{
      const crew=TMModel.peopleOnBrand(s,b.id);
      const items=(b.items||[]).filter(i=>tagOf(b.id,i.id).kind==="count"&&planQty(m,b.id,i.id))
        .map(i=>{
          const planned=planQty(m,b.id,i.id), split=lineAlloc(m,b.id,i.id);
          const given=Object.keys(split).reduce((t,k)=>t+split[k],0);
          return {i,planned,split,given,gap:planned-given};
        });
      return {b,crew,items,planned:items.reduce((t,x)=>t+x.planned,0),given:items.reduce((t,x)=>t+x.given,0)};
    });
    const per={};
    channels.forEach(c=>c.items.forEach(x=>Object.keys(x.split).forEach(pid=>{per[pid]=(per[pid]||0)+x.split[pid];})));
    return {pod,people,channels,per,
      planned:channels.reduce((t,c)=>t+c.planned,0),
      given:channels.reduce((t,c)=>t+c.given,0)};
  });
}

function renderWorkload(){
  const m=ui.month, s=structOf(m);
  const filled=autoFillWorkload(m);
  if(filled){ saveAllocMonth(m); setTimeout(()=>toast(`Filled ${filled} channel${filled===1?"":"s"} from the structure`),80); }
  const board=podWorkload(m);
  if(!s.pods.length)return `<div class="card empty"><h2>No pods yet</h2><p>Build the pods in <a href="#pods">Builder</a> first, then the plan lands on them here.</p></div>`;
  const planned=board.reduce((t,x)=>t+x.planned,0), given=board.reduce((t,x)=>t+x.given,0);
  const orphans=config.brands.filter(b=>!s.bpod[b.id]&&(b.items||[]).some(i=>planQty(m,b.id,i.id)));
  const crewless=config.brands.filter(b=>s.bpod[b.id]&&!TMModel.peopleOnBrand(s,b.id).length&&(b.items||[]).some(i=>planQty(m,b.id,i.id)));
  return `
  <div class="row between"><h1 style="font-size:22px">${esc(monthLabel(m))} workload</h1>
    <span class="muted small">Straight from the Deliverables plan, shared between the people on each channel.</span></div>
  <div class="tiles">
    <div class="tile t-acc"><div class="l">Pieces this month</div><div class="v num">${planned||"–"}</div></div>
    <div class="tile ${planned&&given===planned?"t-epi":"t-mpi"}"><div class="l">Placed on people</div><div class="v num">${given||"–"}</div></div>
    <div class="tile"><div class="l">Pods</div><div class="v num">${board.length}</div></div>
    <div class="tile ${orphans.length||crewless.length?"t-low":""}"><div class="l">Channels not covered</div><div class="v num">${orphans.length+crewless.length||"–"}</div></div>
  </div>
  ${orphans.length||crewless.length?`<div class="card" style="border-color:var(--low)">
    <h2>These channels have a plan but nobody to do it</h2>
    ${orphans.map(b=>`<div class="issue"><span class="err">No pod</span> ${esc(b.name)} is not in any pod — <a href="#pods">put it in one</a>.</div>`).join("")}
    ${crewless.map(b=>`<div class="issue"><span class="err">No people</span> ${esc(b.name)} has nobody on it — <a href="#pods">open its pod and tick who works on it</a>.</div>`).join("")}
  </div>`:""}
  ${board.map(x=>podWorkCard(m,x)).join("")}
  <p class="muted small">These are the same numbers as <a href="#split">Allocation → Split</a> and <a href="#load">Team load</a> — changing one changes the other. Change the plan in <a href="#plan">Deliverables</a> and press <b>Re-split</b> to take the new number.</p>`;
}

function podWorkCard(m,x){
  const people=x.people, done=x.planned&&x.given===x.planned;
  return `
  <div class="card">
    <div class="row between">
      <h2><span style="display:inline-block;width:10px;height:10px;border-radius:3px;background:${esc(x.pod.color||"#2f6b4f")};margin-right:7px"></span>${esc(x.pod.name)}</h2>
      <span class="small ${done?"":"muted"}" style="${done?"color:var(--epi);font-weight:700":""}">${x.planned?`${x.given} of ${x.planned} pieces placed`:"nothing planned"}</span>
    </div>
    ${x.channels.length?x.channels.map(c=>`
      <div class="line">
        <div class="row between">
          <div><b>${esc(c.b.name)}</b> <span class="muted small">${c.crew.length?c.crew.map(pid=>{const p=memberById(pid);return p?esc(TMModel.displayNameOf(p)):"";}).filter(Boolean).join(", "):"nobody on it"}</span></div>
          <span class="muted small num">${c.planned} planned</span>
        </div>
        ${c.items.length?c.items.map(it=>`
          <div style="margin-top:10px">
            <div class="row between">
              <span class="small"><b>${esc(it.i.name)}</b> <span class="muted">· ${it.planned} to deliver</span></span>
              <div class="row">${it.gap?`<span class="lineinfo ${it.gap>0?"under":"over"}">${it.gap>0?it.gap+" not placed":Math.abs(it.gap)+" over"}</span>`:`<span class="lineinfo ok">all placed</span>`}
                ${c.crew.length?`<button class="ghost" data-resplit="${c.b.id}|${it.i.id}">Re-split</button>`:""}</div>
            </div>
            <div class="agrid">
              ${c.crew.map(pid=>{const p=memberById(pid);if(!p)return "";
                return `<label for="wl-${c.b.id}-${it.i.id}-${pid}"><span>${esc(TMModel.displayNameOf(p))}</span>
                  <input type="number" min="0" step="1" inputmode="numeric" id="wl-${c.b.id}-${it.i.id}-${pid}" data-wl="${c.b.id}|${it.i.id}|${pid}" value="${it.split[pid]??""}" aria-label="${esc(TMModel.displayNameOf(p))} ${esc(it.i.name)}"></label>`;}).join("")}
            </div>
          </div>`).join("")
          :`<p class="muted small" style="margin:8px 0 0">Nothing planned for this channel in ${esc(monthLabel(m))}.</p>`}
      </div>`).join("")
      :`<div class="empty">No channels in this pod.</div>`}
    ${people.length?`<div class="sublab">What each person carries</div>
      <div class="chips">${people.map(p=>`<span class="chip"><b>${esc(TMModel.displayNameOf(p))}</b><span class="own">${x.per[p.id]||0}</span></span>`).join("")}
      ${Object.keys(x.per).filter(pid=>!people.some(p=>p.id===pid)).map(pid=>{const p=memberById(pid);
        return p?`<span class="chip" title="From another pod"><b>${esc(TMModel.displayNameOf(p))}</b><span class="own">${x.per[pid]} · floater</span></span>`:"";}).join("")}</div>`:""}
  </div>`;
}

    const pa=(amonths[pm]&&amonths[pm].a)||{}, d=ui.adrafts[m+"|"+pid].d;
    let n=0; for(const [k,v] of Object.entries(pa)){ if(k.slice(-suffix.length)!==suffix)continue; if(v!==""&&v!=null){d[k.slice(0,k.length-suffix.length)]=+v;n++;} }

  if(t.dataset.podedit){ui.podEdit=t.dataset.podedit;ui.confirmDel=null;render();window.scrollTo({top:0});return;}
  if(t.id==="donePod"||t.id==="donePod2"){ui.podEdit=null;ui.confirmDel=null;render();window.scrollTo({top:0});return;}
  if(t.dataset.podmove){

    const a=list[i].sort;list[i].sort=list[j].sort;list[j].sort=a;
    render();await saveStruct(m);return;}
  if(t.dataset.poddel){ui.confirmDel=t.dataset.poddel;render();return;}
  if(t.dataset.poddelyes){
    const m=ui.month,s=structOf(m),id=t.dataset.poddelyes;

    s.pods=s.pods.filter(p=>p.id!==id);
    ui.confirmDel=null;ui.podEdit=null;render();await saveStruct(m);toast("Pod deleted — its channels and people are back in the list");return;}
  if(t.id==="copyPrevStruct"){

  if(t.dataset.bdel||t.dataset.idel){ui.confirmDel=t.dataset.bdel||t.dataset.idel;render();return;}
  if(t.dataset.bdelyes){config.brands=config.brands.filter(x=>x.id!==t.dataset.bdelyes);ui.confirmDel=null;ui.brandSel=null;render();await saveConfig();toast("Brand removed");return;}

  if(t.id==="saveEntry"){

  }
  if(t.id==="copyPrev"){
    const m=ui.month,p=ui.entryPerson,prev=months[shiftMonth(m,-1)]?.e?.[p]||{},d=ui.drafts[m+"|"+p].d;

  }
  if(t.id==="export"){await exportExcel();return;}
  if(t.id==="exportCsv"){await exportCSV();return;}
  if(t.id==="sheetConnect"){
    const u=document.getElementById("sheetUrl").value.trim();
    if(!u){sheet.url="";lsSet(LS_URL,"");setConn("off");render();toast("Sheet URL cleared.");return;}

view().addEventListener("change",async e=>{
  const t=e.target;
  if(t.id==="dashPerson"){ui.dashPerson=t.value;render();return;}
  if(t.id==="brandDash"){ui.brandDash=t.value;render();return;}
  if(t.id==="allocPerson"){ui.allocPerson=t.value;render();return;}
  if(t.dataset.wl){
    const m=ui.month,k=t.dataset.wl;
    amonths[m]=amonths[m]||{a:{}}; amonths[m].a=amonths[m].a||{};
    if(t.value===""||+t.value<=0)delete amonths[m].a[k]; else amonths[m].a[k]=+t.value;
    render();await saveAllocMonth(m);return;}
  // ---- structure ----
  if(t.dataset.stmeta){const m=ui.month,s=structOf(m);s.meta[t.dataset.stmeta]=t.value;await saveStruct(m);return;}
  if(t.dataset.podname||t.dataset.podtype||t.dataset.podcolor||t.dataset.poddesc){
    const m=ui.month,s=structOf(m);
    const id=t.dataset.podname||t.dataset.podtype||t.dataset.podcolor||t.dataset.poddesc;
    const pod=TMModel.podById(s,id); if(!pod)return;
    if(t.dataset.podname){const v=t.value.trim();if(!v)return;pod.name=v;}
    if(t.dataset.podtype)pod.type=t.value;
    if(t.dataset.podcolor)pod.color=t.value;
    if(t.dataset.poddesc)pod.desc=t.value;
    render();await saveStruct(m);return;}
  if(t.dataset.podbrand){await moveToPod("brand",t.dataset.podbrand,t.checked?ui.podEdit:"");return;}
  if(t.dataset.podperson){await moveToPod("member",t.dataset.podperson,t.checked?ui.podEdit:"");return;}
  if(t.dataset.owner){
    const m=ui.month,s=structOf(m),bid=t.dataset.owner;
    const o=s.own[bid]||{p:"",b:"",pct:TMModel.DEFAULT_OWNER_PCT};
    if(t.dataset.slot==="pct")o.pct=Math.max(0,Math.min(100,+t.value||0)); else o[t.dataset.slot]=t.value;
    if(!o.p&&!o.b)delete s.own[bid]; else s.own[bid]=o;
    if(o.p){s.bteam[bid]=[...new Set([...(s.bteam[bid]||[]),o.p])];}  // the owner works on it too
    render();await saveStruct(m);toast("Owner updated");return;}
  if(t.dataset.bteam){
    const m=ui.month,s=structOf(m),bid=t.dataset.bteam,cur=s.bteam[bid]||[];
    s.bteam[bid]=t.checked?[...new Set([...cur,t.value])]:cur.filter(x=>x!==t.value);
    if(!s.bteam[bid].length)delete s.bteam[bid];
    render();await saveStruct(m);return;}
  if(t.dataset.memfld){const p=memberById(t.dataset.memfld);if(p){const f=t.dataset.sf;
    p[f]=f==="capacity"?(t.value===""?"":+t.value):t.value;
    render();await saveConfig();}return;}
  if(t.dataset.role){
    const m=ui.month,s=structOf(m),pid=t.dataset.role,cur=TMModel.rolesOf(s,pid);
    s.roles[pid]=t.checked?[...new Set([...cur,t.value])]:cur.filter(x=>x!==t.value);
    if(!s.roles[pid].length)delete s.roles[pid];
    render();await saveStruct(m);return;}
  if(t.dataset.ar){
    const m=ui.month,pid=ui.allocWho,d=ui.adrafts[m+"|"+pid].d,k=t.dataset.ar;
    if(t.checked)d[k]=1; else delete d[k];
    const lab=t.closest("label"); if(lab)lab.style.borderColor=t.checked?"var(--accent)":"var(--line)";
    refreshSplitLive(m,pid,d,k);
    return;}
  if(t.dataset.kind||t.dataset.ck){
    const key=t.dataset.kind||t.dataset.ck, cur=config.atags[key]||{};
    config.atags[key]=Object.assign({},cur,t.dataset.kind?{kind:t.value}:{ck:t.value});
    render();await saveConfig();toast(t.dataset.kind?(t.value==="resp"?"Marked as a responsibility":"Marked as a deliverable"):"Weight set to "+t.value);
    return;}
  if(t.dataset.bname){const b=brandById(t.dataset.bname);const v=t.value.trim();
    if(b&&v&&v!==b.name){b.name=v;render();await saveConfig();toast("Brand renamed");}return;}
  if(t.dataset.iname){const b=brandById(t.dataset.b);const it=b&&(b.items||[]).find(x=>x.id===t.dataset.iname);const v=t.value.trim();
    if(it&&v&&v!==it.name){it.name=v;render();await saveConfig();toast("Deliverable renamed");}return;}
  if(t.dataset.pname){const p=config.team.find(x=>x.id===t.dataset.pname);const v=t.value.trim();if(p&&v&&v!==p.name){p.name=v;await saveConfig();toast("Name updated");}return;}
  if(t.dataset.plevel){const p=config.team.find(x=>x.id===t.dataset.plevel);if(p){p.level=t.value;
      // carry assignments over to the same job names at the new level
      p.jobs=p.jobs.map(j=>{const L=libById(j);if(!L)return null;if(L.level===p.level)return j;const M=config.lib.find(x=>x.level===p.level&&x.category===L.category&&x.job===L.job);return M?M.id:null;}).filter(Boolean);
      render();await saveConfig();}return;}
  if(t.dataset.assign){const p=config.team.find(x=>x.id===t.dataset.assign);if(p){const j=t.dataset.j;p.jobs=t.checked?[...new Set([...p.jobs,j])]:p.jobs.filter(x=>x!==j);
      const lab=t.closest(".card").querySelector(".muted.small");if(lab)lab.textContent=p.jobs.length+" jobs assigned";await saveConfig();}return;}
  if(t.dataset.set){const v=+t.value;if(isFinite(v)&&v>=0){config.settings[t.dataset.set]=v;await saveConfig();toast("Rule updated");}return;}
  if(t.dataset.jname){const L=libById(t.dataset.jname);const v=t.value.trim();if(L&&v){L.job=v;await saveConfig();toast("Job renamed");}return;}
  if(t.dataset.jck){const L=libById(t.dataset.jck);if(L){L.ck=t.value;await saveConfig();toast("Updated to "+t.value);}return;}
});
view().addEventListener("submit",async e=>{
  e.preventDefault();
  if(e.target.id==="addMember"){const name=document.getElementById("newName").value.trim();if(!name)return;
    config.team.push({id:uid("p"),name,level:document.getElementById("newLevel").value,jobs:[]});render();await saveConfig();toast(name+" added. Tick their jobs below.");}
  if(e.target.id==="addJob"){const lv=document.getElementById("jLevel").value,cat=document.getElementById("jCat").value.trim(),job=document.getElementById("jName").value.trim(),ck=document.getElementById("jCk").value;
    if(!cat||!job)return; for(const l of (lv==="Both"?["Junior","Senior"]:[lv])) config.lib.push({id:uid("j"),level:l,category:cat,job,ck});
    render();await saveConfig();toast(job+" added");}
  if(e.target.id==="addBrand"){const name=document.getElementById("newBrand").value.trim();if(!name)return;
    const b={id:uid("b"),name,items:[]};config.brands.push(b);ui.brandSel=b.id;ui.confirmDel=null;
    render();await saveConfig();toast(name+" added. Now add its deliverables.");}
  if(e.target.id==="addItem"){const b=brandById(ui.brandSel);if(!b)return;
    const name=document.getElementById("newItem").value.trim(), qty=document.getElementById("newItemQty").value;
    if(!name)return;
    const it={id:uid("i"),name}; b.items=b.items||[]; b.items.push(it);
    const k=ui.month+"|"+b.id, hasQty=qty!==""&&isFinite(+qty);
    if(hasQty&&ui.bdrafts[k])ui.bdrafts[k].d[it.id]=+qty;
    render();await saveConfig();
    toast(hasQty?name+" added. Press Save to keep the quantity.":name+" added");}
});

// ---------- Downloads ----------
async function download(filename,blob){
  let dl=null; try{dl=await window.claude?.use?.("downloads");}catch(e){}
  if(dl){ try{await dl.save({filename,data:blob});toast("Saved "+filename);return;}
    catch(err){ if(err&&err.code==="declined")return;
      if(err&&err.code==="rate_limited"){toast("A save is already open. Try again in a moment.");return;} } }
  try{
    const a=document.createElement("a"), u=URL.createObjectURL(blob);
    a.href=u; a.download=filename; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(u),2000); toast("Downloaded "+filename);
  }catch(e){ toast("Couldn't save the file."); }
}

// ---------- CSV export ----------
const csvCell=v=>{const s=v==null?"":String(v);return /[",\n\r]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s;};
const toCSV=rows=>"﻿"+rows.map(r=>r.map(csvCell).join(",")).join("\r\n");   // BOM so Excel opens it correctly
const pc1=v=>v==null?"":Math.round(v*1000)/10;
function csvRows(kind,m){
  const board=teamBoard(m), scored=board.filter(x=>x.overall!=null);
  if(kind==="summary"){
    const r=[["Team metrics","",monthLabel(m)],[],["Rank","Name","Level","Jobs","Critical jobs","Overall %","Critical < LPI","Status"]];
    board.forEach(x=>r.push([x.rank??"",x.p.name,x.p.level,x.rows.length,x.crit,pc1(x.overall),x.overall==null?"":x.critFail,x.status?(x.status==="Below"?"Below LPI":x.status):"No data"]));
    r.push([],["Team average","","","","",scored.length?pc1(scored.reduce((t,x)=>t+x.overall,0)/scored.length):""]);
    [["EPI","EPI"],["MPI","MPI"],["LPI","LPI"],["Below","Below LPI"]].forEach(([k,l])=>r.push([l,scored.filter(x=>x.status===k).length]));
    return r;
  }
  if(kind==="trend"){
    const ms=[...Array(6)].map((_,i)=>shiftMonth(m,i-5));
    const r=[["Name","Level",...ms.map(monthLabel)]];
    config.team.forEach(p=>r.push([p.name,p.level,...ms.map(mm=>pc1(personScore(p,mm).overall))]));
    return r;
  }
  const r=[["Month","Name","Level","Category","Job / Role","C/K","Goal","Actual","Achievement %","Status"]];
  board.forEach(x=>x.rows.forEach(w=>r.push([monthLabel(m),x.p.name,x.p.level,w.cat,w.job,w.ck,w.g,w.a,pc1(w.ach),w.st==="Below"?"Below LPI":w.st])));
  return r;
}
async function exportCSV(){
  const kind=document.getElementById("csvKind")?.value||"details", m=ui.month;
  const label={details:"Details",summary:"Summary",trend:"6 month trend"}[kind]||"Details";
  const rows=csvRows(kind,m);
  if(rows.length<2){toast("Nothing to export for "+monthLabel(m));return;}
  await download(`Team metrics ${monthLabel(m)} - ${label}.csv`,new Blob([toCSV(rows)],{type:"text/csv;charset=utf-8"}));
}

// ---------- Excel export ----------
async function exportExcel(){
  if(!window.XLSX){toast("Excel library didn't load. Reload the page.");return;}
  const m=ui.month, board=teamBoard(m), wb=XLSX.utils.book_new(), P="0%";
  const sum=[["Month",monthLabel(m)],[],["Rank","Name","Level","Jobs","Critical jobs","Overall %","Critical < LPI","Status"]];
  board.forEach(x=>sum.push([x.rank??"",x.p.name,x.p.level,x.rows.length,x.crit,x.overall??"",x.overall==null?"":x.critFail,x.status?(x.status==="Below"?"Below LPI":x.status):"No data"]));
  const scored=board.filter(x=>x.overall!=null);
  sum.push([],["Team average","","","","",scored.length?scored.reduce((t,x)=>t+x.overall,0)/scored.length:""]);
  sum.push(["EPI",scored.filter(x=>x.status==="EPI").length],["MPI",scored.filter(x=>x.status==="MPI").length],["LPI",scored.filter(x=>x.status==="LPI").length],["Below LPI",scored.filter(x=>x.status==="Below").length]);
  const ws1=XLSX.utils.aoa_to_sheet(sum); fmtCol(ws1,5,P); ws1["!cols"]=[{wch:12},{wch:20},{wch:9},{wch:7},{wch:12},{wch:11},{wch:14},{wch:11}];
  XLSX.utils.book_append_sheet(wb,ws1,"Summary");
  const det=[["Name","Level","Category","Job / Role","C/K","Goal","Actual","Achievement %","Status"]];
  board.forEach(x=>x.rows.forEach(r=>det.push([x.p.name,x.p.level,r.cat,r.job,r.ck,r.g,r.a,r.ach,r.st==="Below"?"Below LPI":r.st])));
  const ws2=XLSX.utils.aoa_to_sheet(det); fmtCol(ws2,7,P); ws2["!cols"]=[{wch:20},{wch:9},{wch:18},{wch:18},{wch:9},{wch:8},{wch:8},{wch:14},{wch:11}];
  XLSX.utils.book_append_sheet(wb,ws2,"Details");
  const ms=[...Array(6)].map((_,i)=>shiftMonth(m,i-5));
  const tr=[["Name",...ms.map(monthLabel)]]; config.team.forEach(p=>tr.push([p.name,...ms.map(mm=>personScore(p,mm).overall??"")]));
  const ws3=XLSX.utils.aoa_to_sheet(tr); for(let c=1;c<=6;c++)fmtCol(ws3,c,P); ws3["!cols"]=[{wch:20},...ms.map(()=>({wch:11}))];
  XLSX.utils.book_append_sheet(wb,ws3,"6-month trend");
  const buf=XLSX.write(wb,{bookType:"xlsx",type:"array"});
  await download(`Team metrics ${monthLabel(m)}.xlsx`,new Blob([buf],{type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"}));
}
function fmtCol(ws,c,z){const r=XLSX.utils.decode_range(ws["!ref"]);for(let R=r.s.r;R<=r.e.r;R++){const cell=ws[XLSX.utils.encode_cell({r:R,c})];if(cell&&cell.t==="n")cell.z=z;}}

// ---------- Start ----------
cacheLoad();
go();
pullSheet();
})();
