<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Team Metrix tests</title>
<style>
:root{--bg:#f3f5f2;--surface:#fff;--ink:#18221c;--muted:#5d6b62;--line:#dde3dd;--ok:#1f8a4c;--bad:#b42318;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#111613;--surface:#1a211d;--ink:#e7ede8;--muted:#9aa89f;--line:#2c3630;--ok:#5fd08f;--bad:#f2867b;color-scheme:dark}}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 "IBM Plex Sans",system-ui,sans-serif}
main{max-width:860px;margin:0 auto;padding:24px 20px}
h1{font-size:22px;margin:0 0 4px}
.sum{font-weight:700;margin:14px 0 18px;padding:10px 14px;border-radius:10px;background:var(--surface);border:1px solid var(--line)}
.sum.pass{color:var(--ok)} .sum.fail{color:var(--bad)}
ul{list-style:none;margin:0;padding:0}
li{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 12px;margin-bottom:6px;font-size:14px}
li .tag{font-weight:700;margin-right:8px}
li.ok .tag{color:var(--ok)} li.bad .tag{color:var(--bad)}
.msg{display:block;color:var(--bad);font-size:13px;margin-top:4px;font-family:ui-monospace,Menlo,monospace}
.muted{color:var(--muted);font-size:13px}
</style>
</head>
<body>
<main>
  <h1>Team Metrix tests</h1>
  <p class="muted">The same cases run from the command line with <code>node tests/run.js</code>.</p>
  <div class="sum" id="sum">Running…</div>
  <ul id="list"></ul>
</main>
<script src="model.js"></script>
<script src="tests/cases.js"></script>
<script>
(function(){
  var out=TMCases.run(TMModel);
  var sum=document.getElementById("sum");
  sum.textContent=out.passed+" passed, "+out.failed+" failed";
  sum.className="sum "+(out.failed?"fail":"pass");
  document.getElementById("list").innerHTML=out.results.map(function(r){
    return '<li class="'+(r.ok?"ok":"bad")+'"><span class="tag">'+(r.ok?"ok":"FAIL")+'</span>'+
      r.name.replace(/[&<>]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;"}[c];})+
      (r.ok?"":'<span class="msg">'+String(r.msg).replace(/[&<>]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;"}[c];})+'</span>')+'</li>';
  }).join("");
})();
</script>
</body>
</html>
